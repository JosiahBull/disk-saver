[package]
name = "disk-saver"
description = "A small, boring, trustworthy disk janitor for macOS and Linux."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["disk", "cleanup", "cache", "docker", "housekeeping"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "disk-saver"
path = "src/main.rs"

[dependencies]
disk-saver-core.workspace = true
disk-saver-kv.workspace = true
disk-saver-platform.workspace = true

disk-saver-adapter-docker = { workspace = true, optional = true }
disk-saver-adapter-node-modules = { workspace = true, optional = true }
disk-saver-adapter-rust-target = { workspace = true, optional = true }
disk-saver-adapter-python-cache = { workspace = true, optional = true }
disk-saver-adapter-trash = { workspace = true, optional = true }
disk-saver-adapter-pnpm = { workspace = true, optional = true }
disk-saver-adapter-cargo-registry = { workspace = true, optional = true }
disk-saver-adapter-pip = { workspace = true, optional = true }
disk-saver-adapter-git-gc = { workspace = true, optional = true }
disk-saver-adapter-git-ignored = { workspace = true, optional = true }

clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
bytesize.workspace = true
humantime.workspace = true
fd-lock = { workspace = true }

[features]
default = [
    "docker",
    "node-modules",
    "rust-target",
    "python-cache",
    "trash",
    "pnpm",
    "cargo-registry",
    "pip",
    "git-gc",
    "git-ignored",
    "decision-log",
]
docker = ["dep:disk-saver-adapter-docker"]
node-modules = ["dep:disk-saver-adapter-node-modules"]
rust-target = ["dep:disk-saver-adapter-rust-target"]
python-cache = ["dep:disk-saver-adapter-python-cache"]
trash = ["dep:disk-saver-adapter-trash"]
pnpm = ["dep:disk-saver-adapter-pnpm"]
cargo-registry = ["dep:disk-saver-adapter-cargo-registry"]
pip = ["dep:disk-saver-adapter-pip"]
git-gc = ["dep:disk-saver-adapter-git-gc"]
git-ignored = ["dep:disk-saver-adapter-git-ignored"]
decision-log = ["disk-saver-core/decision-log"]

[dev-dependencies]
disk-saver-core.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
predicates.workspace = true

[lints]
workspace = true
