[package]
name = "disk-saver"
description = "A small, boring, trustworthy disk janitor for macOS and Linux."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["disk", "cleanup", "cache", "docker", "housekeeping"]
categories = ["command-line-utilities", "filesystem"]

# ── cargo-binstall ───────────────────────────────────────────────────────────
# Lets `cargo binstall disk-saver` fetch a prebuilt archive from the GitHub
# release instead of compiling the tree. Without this, binstall guesses
# `{ name }-{ target }{ archive-suffix }` — the full Rust target triple — and
# the release workflow publishes shorter, human-readable names, so every guess
# would 404 and binstall would silently fall back to a from-source build.
#
# `{ os-name }` is rustc's OS name (`linux`/`macos`) and `{ target-arch }` is the
# CPU (`x86_64`/`aarch64`), which together reproduce four of the six asset names
# exactly. Only the two musl legs carry an extra suffix, so they get one override
# each, keyed by the exact triple.
#
# `bin-dir` is the path *inside* the archive: release.yml tars a staging
# directory named after the asset, so the binary sits one level down.
#
# Note binstall resolves a crate through crates.io by default, so until
# `disk-saver` is published there this works via
# `cargo binstall --git https://github.com/JosiahBull/disk-saver disk-saver`.
# The signatures in the release are cosign/sigstore, which binstall cannot yet
# verify (it supports minisign only) — see CONTRIBUTING.md.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ os-name }-{ target-arch }.tar.gz"
bin-dir = "{ name }-{ os-name }-{ target-arch }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64-musl.tar.gz"
bin-dir = "{ name }-linux-x86_64-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64-musl.tar.gz"
bin-dir = "{ name }-linux-aarch64-musl/{ bin }{ binary-ext }"

[[bin]]
name = "disk-saver"
path = "src/main.rs"

[dependencies]
disk-saver-core.workspace = true
disk-saver-kv.workspace = true
disk-saver-platform.workspace = true

disk-saver-adapter-docker = { workspace = true, optional = true }
disk-saver-adapter-node-modules = { workspace = true, optional = true }
disk-saver-adapter-rust-target = { workspace = true, optional = true }
disk-saver-adapter-python-cache = { workspace = true, optional = true }
disk-saver-adapter-trash = { workspace = true, optional = true }
disk-saver-adapter-pnpm = { workspace = true, optional = true }
disk-saver-adapter-cargo-registry = { workspace = true, optional = true }
disk-saver-adapter-pip = { workspace = true, optional = true }
disk-saver-adapter-git-gc = { workspace = true, optional = true }
disk-saver-adapter-git-ignored = { workspace = true, optional = true }

clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
bytesize.workspace = true
humantime.workspace = true
fd-lock = { workspace = true }

[features]
default = [
    "docker",
    "node-modules",
    "rust-target",
    "python-cache",
    "trash",
    "pnpm",
    "cargo-registry",
    "pip",
    "git-gc",
    "git-ignored",
    "decision-log",
]
docker = ["dep:disk-saver-adapter-docker"]
node-modules = ["dep:disk-saver-adapter-node-modules"]
rust-target = ["dep:disk-saver-adapter-rust-target"]
python-cache = ["dep:disk-saver-adapter-python-cache"]
trash = ["dep:disk-saver-adapter-trash"]
pnpm = ["dep:disk-saver-adapter-pnpm"]
cargo-registry = ["dep:disk-saver-adapter-cargo-registry"]
pip = ["dep:disk-saver-adapter-pip"]
git-gc = ["dep:disk-saver-adapter-git-gc"]
git-ignored = ["dep:disk-saver-adapter-git-ignored"]
decision-log = ["disk-saver-core/decision-log"]

[dev-dependencies]
disk-saver-core.workspace = true
assert_cmd.workspace = true
tempfile.workspace = true
predicates.workspace = true

[lints]
workspace = true
