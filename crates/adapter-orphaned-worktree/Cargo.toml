[package]
name = "disk-saver-adapter-orphaned-worktree"
description = "disk-saver adapter for git worktrees whose repository no longer knows them."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
disk-saver-core.workspace = true
disk-saver-scan.workspace = true
serde.workspace = true
anyhow.workspace = true
globset.workspace = true
humantime-serde.workspace = true
tracing.workspace = true

[dev-dependencies]
# `decision-log` so the tests can read back the reasons `why` would show.
disk-saver-core = { workspace = true, features = ["decision-log"] }
disk-saver-platform = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
