[package]
name = "disk-saver-core"
description = "Adapter trait, engine, pressure model and config for disk-saver."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
disk-saver-kv.workspace = true
disk-saver-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
bytesize.workspace = true
globset.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
# When on, decisions are recorded to the sqlite database <state_dir>/decisions.db
# and `why` works. When off, DecisionLog is a ZST with inlined no-op methods (call
# sites unchanged) and sqlite is not linked by this crate.
decision-log = ["dep:rusqlite"]

[dev-dependencies]
disk-saver-platform = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
