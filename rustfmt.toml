# Pinned explicitly rather than inherited from `edition`. rustfmt derives its style edition
# from the package edition by default, so bumping the language edition silently reformats the
# whole tree — the 2024 style edition sorts `use` items by ASCII, putting `{Context, bail}`
# where 2021 put `{bail, Context}`. Naming it here decouples the two, so a future edition bump
# is a language change and a reformat stays a deliberate one.
style_edition = "2024"
